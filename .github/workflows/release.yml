name: Cloud release
on:
  workflow_call:
    inputs:
      build_android:
        type: boolean
        default: false
    secrets:
      EXPO_TOKEN:
        required: true
  workflow_dispatch:
    inputs:
      build_android:
        description: Build a standalone APK (initial release or native changes)
        type: boolean
        default: false
permissions:
  contents: read
  actions: read
  id-token: write
concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false
jobs:
  release:
    if: github.ref_name == 'dev' || github.ref_name == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      RELEASE_BRANCH: ${{ github.ref_name }}
      RELEASE_SHA: ${{ github.sha }}
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_SHA }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Resolve target and require credentials
        env:
          DEV_PROVIDER: ${{ vars.FIREBASE_DEV_PROVIDER }}
          PROD_PROVIDER: ${{ vars.FIREBASE_PROD_PROVIDER }}
          DEV_ACCOUNT: ${{ vars.FIREBASE_DEV_SERVICE_ACCOUNT }}
          PROD_ACCOUNT: ${{ vars.FIREBASE_PROD_SERVICE_ACCOUNT }}
        run: |
          test -n "$EXPO_TOKEN" || { echo '::error::Add the EXPO_TOKEN repository secret.'; exit 1; }
          if [ "$RELEASE_BRANCH" = main ]; then
            echo 'TARGET_PROJECT=gamified-todo-prod-jellotheman' >> "$GITHUB_ENV"
            echo 'EAS_TARGET=production' >> "$GITHUB_ENV"
            provider="$PROD_PROVIDER"; account="$PROD_ACCOUNT"
          elif [ "$RELEASE_BRANCH" = dev ]; then
            echo 'TARGET_PROJECT=gamified-todo-dev-jellotheman' >> "$GITHUB_ENV"
            echo 'EAS_TARGET=preview' >> "$GITHUB_ENV"
            provider="$DEV_PROVIDER"; account="$DEV_ACCOUNT"
          else
            echo '::error::Release branch must be dev or main.'; exit 1
          fi
          test -n "$provider" && test -n "$account" || { echo '::error::Configure Firebase federation repository variables.'; exit 1; }
          echo "FIREBASE_PROVIDER=$provider" >> "$GITHUB_ENV"
          echo "FIREBASE_ACCOUNT=$account" >> "$GITHUB_ENV"
      - name: Verify exact commit passed Checks and remains current
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          current=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$RELEASE_BRANCH" --jq .object.sha)
          test "$current" = "$RELEASE_SHA" || { echo '::error::A newer commit exists; release its checked version.'; exit 1; }
          gh api "repos/$GITHUB_REPOSITORY/commits/$RELEASE_SHA/check-runs" --jq '.check_runs[] | select(.name == "checks" and .app.slug == "github-actions" and .status == "completed" and .conclusion == "success") | .conclusion' | grep -q success
      - run: npm ci
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ env.FIREBASE_PROVIDER }}
          service_account: ${{ env.FIREBASE_ACCOUNT }}
          project_id: ${{ env.TARGET_PROJECT }}
      - run: npm run build:functions
      - name: Deploy Firebase backend
        run: npx firebase-tools deploy --only functions,firestore --project "$TARGET_PROJECT" --non-interactive
      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - name: Publish compatible update
        working-directory: apps/mobile
        run: eas update --channel "$EAS_TARGET" --environment "$EAS_TARGET" --platform all --message "$RELEASE_BRANCH $RELEASE_SHA" --non-interactive
      - name: Build APK when requested
        if: inputs.build_android
        working-directory: apps/mobile
        run: eas build --profile "$EAS_TARGET" --platform android --non-interactive --wait
